<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>RunTable Pro - Immersive TRPG Table</title>
    <meta name="theme-color" content="#202636" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #020617;
      }

      #initial-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #e2e8f0;
        font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
      }

      #initial-loader strong {
        display: block;
        margin-bottom: 0.5rem;
        color: #818cf8;
        font-size: 1.75rem;
        letter-spacing: 0.04em;
      }

      #initial-loader span {
        color: #64748b;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div>
          <strong>RunTable</strong>
          <span>Loading...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
